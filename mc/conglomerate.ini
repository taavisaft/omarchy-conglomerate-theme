[skin]
    description = Conglomerate — charcoal, antique gold, ivory, and racing green
    truecolors = true

[Lines]
    horiz = ─
    vert = │
    lefttop = ┌
    righttop = ┐
    leftbottom = └
    rightbottom = ┘
    topmiddle = ┬
    bottommiddle = ┴
    leftmiddle = ├
    rightmiddle = ┤
    cross = ┼
    dhoriz = ═
    dvert = ║
    dlefttop = ╔
    drighttop = ╗
    dleftbottom = ╚
    drightbottom = ╝
    dtopmiddle = ╤
    dbottommiddle = ╧
    dleftmiddle = ╟
    drightmiddle = ╢

[aliases]
    Base = #000000
    BaseDark = #000000
    Raised = #18201c
    Gold = #d2b36c
    GoldBright = #f0d78e
    Ivory = #e8e0cf
    IvoryBright = #fff9ea
    Muted = #817661
    Green = #9a7b3f
    GreenDark = #2e271a
    Burgundy = #5a242a
    Red = #8e3b42
    Blue = #5e7892
    Cyan = #70a99a
    Magenta = #805d78

[core]
    _default_ = Ivory;Base
    selected = Base;Gold
    marked = GoldBright;;bold
    markselect = Base;GoldBright;bold
    gauge = Base;Gold
    input = IvoryBright;Raised
    inputunchanged = Muted;Raised
    inputmark = Base;Gold
    disabled = Muted;BaseDark
    reverse = Base;Gold
    commandlinemark = Base;Gold
    header = Gold
    shadow = #040504;#040504

[dialog]
    _default_ = Ivory;Raised
    dfocus = IvoryBright;GreenDark
    dhotnormal = GoldBright;;underline
    dhotfocus = GoldBright;GreenDark;underline
    dtitle = GoldBright;;bold

[error]
    _default_ = IvoryBright;Burgundy
    errdfocus = IvoryBright;Red
    errdhotnormal = GoldBright;;underline
    errdhotfocus = GoldBright;Red;underline
    errdtitle = GoldBright;;bold

[filehighlight]
    directory = GoldBright
    executable = #c7a65b
    symlink = Cyan
    hardlink = #a79e89
    stalelink = #c56d73
    device = #b87333
    special = Magenta
    core = Red
    temp = Muted
    archive = #8fa7bd
    doc = #f1eadb
    source = #9ac9bd
    media = Blue
    graph = #ac88a3
    database = #b87333

[menu]
    _default_ = Ivory;BaseDark
    menusel = Base;Gold
    menuhot = GoldBright;;underline
    menuhotsel = Base;GoldBright;underline
    menuinactive = Muted;BaseDark

[popupmenu]
    _default_ = Ivory;Raised
    menusel = IvoryBright;GreenDark
    menutitle = GoldBright;;bold

[buttonbar]
    hotkey = GoldBright;BaseDark
    button = Muted;BaseDark

[statusbar]
    _default_ = Ivory;GreenDark

[help]
    _default_ = Ivory;Raised
    helpbold = GoldBright;;bold
    helpitalic = Cyan;;italic
    helplink = #8fa7bd;;underline
    helpslink = Base;Gold

[editor]
    editbold = GoldBright;;bold
    editmarked = IvoryBright;GreenDark
    editwhitespace = ;#3a3324
    editnonprintable = ;Burgundy
    editlinestate = Base;Gold
    bookmark = Base;Gold
    bookmarkfound = Base;GoldBright
    editrightmargin = ;Burgundy
    editbg = ;BaseDark
    editframe = Muted
    editframeactive = Gold
    editframedrag = GoldBright

[viewer]
    viewbold = GoldBright;;bold
    viewunderline = Cyan;;underline
    viewselected = IvoryBright;GreenDark

[diffviewer]
    added = ;GreenDark
    changedline = ;#3a3324
    changednew = ;#4f3f22
    changed = ;#3c2b20
    removed = ;Burgundy
    error = IvoryBright;Red

[widget-panel]
    sort-up-char = ▴
    sort-down-char = ▾
    hiddenfiles-show-char = •
    hiddenfiles-hide-char = ○
    history-prev-item-char = ◂
    history-next-item-char = ▸
    history-show-list-char = ▾
    filename-scroll-left-char = ◂
    filename-scroll-right-char = ▸

[widget-scrollbar]
    first-vert-char = ▴
    last-vert-char = ▾
    first-horiz-char = ◂
    last-horiz-char = ▸
    current-char = ◆
    background-char = ░

[widget-editor]
    window-state-char = ↕
    window-close-char = ✕
